global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ml-model-metrics'
    static_configs:
      - targets: ['prometheus-exporter:8000']
        labels:
          instance: 'bank-marketing-model'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
